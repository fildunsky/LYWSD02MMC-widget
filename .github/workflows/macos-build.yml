name: macos-build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to attach the app to
        default: v1.0.0
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install universal Python
        run: |
          curl -sLO https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg
          sudo installer -pkg python-3.12.8-macos11.pkg -target /
          /usr/local/bin/python3.12 -m pip install --upgrade pip
      - run: /usr/local/bin/python3.12 -m pip install bleak rumps pillow pyinstaller
      - name: Generate icons
        run: |
          /usr/local/bin/python3.12 -c "import sys; sys.path.insert(0, 'mac'); from lywsd02_widget_mac import make_image; make_image('icon', 512, color=(90, 90, 90, 255)).save('icon.icns'); make_image('icon', 44).save('menubar.png')"
      - run: >
          /usr/local/bin/python3.12 -m PyInstaller --windowed --name lywsd02-widget
          --icon icon.icns --osx-bundle-identifier org.lywsd02.widget
          --target-arch universal2 --add-data "menubar.png:." --exclude-module PIL
          mac/lywsd02_widget_mac.py
      - name: Verify universal binary and patch Info.plist
        run: |
          lipo -archs dist/lywsd02-widget.app/Contents/MacOS/lywsd02-widget
          lipo -archs dist/lywsd02-widget.app/Contents/MacOS/lywsd02-widget | grep -q "x86_64 arm64"
          plutil -replace NSBluetoothAlwaysUsageDescription -string "Reads temperature, humidity and time from the LYWSD02 clock over Bluetooth" dist/lywsd02-widget.app/Contents/Info.plist
          plutil -replace LSUIElement -bool true dist/lywsd02-widget.app/Contents/Info.plist
      - run: ditto -c -k --keepParent dist/lywsd02-widget.app lywsd02-widget-macos-universal.zip
      - run: gh release upload ${{ inputs.release_tag }} lywsd02-widget-macos-universal.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
